# rrk-adoption: the run registry's configuration (RunRegistryKit v0.2.0; its README, "The client's root").
# Runs are recorded under var/runs/ and registered stores live under var/datastores/ (both ignored by git).
runs_root = "var/runs"
stores_root = "var/datastores"
# The drivers' utilities.RECORDED_DISTRIBUTIONS (tests/test_registry_config.py holds them equal).
# The last four are here so that a manifest says which venv wrote a store.
distributions = ["datastorekit", "raypoolkit", "ray", "SQLAlchemy", "numpy", "scipy"]

[stores]
fingerprinter = "config.fingerprint:fingerprinter"
